name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PR Version Bot
        id: versionbot
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: VERSION.md
          changelog-file: CHANGELOG.md
          default-bump: patch
          generate-badge: 'true'
          update-readme: 'true'
          use-release-pr: 'true'

      - name: Push major version tag
        if: steps.versionbot.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.versionbot.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR="v${BASH_REMATCH[1]}"
            git tag -f "$MAJOR"
            git push origin "$MAJOR" --force
          fi
