name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KAJI_LABS_RELEASE_APP_ID }}
          private-key: ${{ secrets.KAJI_LABS_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run PR Version Bot
        id: versionbot
        uses: ./
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-file: VERSION.md
          changelog-file: CHANGELOG.md
          default-bump: patch
          generate-badge: 'true'
          update-readme: 'true'

      - name: Push major version tag
        if: steps.versionbot.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.versionbot.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR="v${BASH_REMATCH[1]}"
            git tag -f "$MAJOR"
            git push origin "$MAJOR" --force
          fi
