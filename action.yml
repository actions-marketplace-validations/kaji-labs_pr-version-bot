name: PR Version Bot
description: Automatic semantic versioning from merged pull request labels
author: Rashay Daya

branding:
  icon: tag
  color: orange

inputs:
  github-token:
    description: GitHub token for API access and git push
    required: true
    default: ${{ github.token }}

  version-file:
    description: Path to the file containing the current semver
    required: false
    default: VERSION.md

  changelog-file:
    description: Path to the changelog file
    required: false
    default: CHANGELOG.md

  default-bump:
    description: Bump type when no release label is present (major, minor, patch)
    required: false
    default: patch

  tag-prefix:
    description: Prefix for git tags
    required: false
    default: v

  create-github-release:
    description: Whether to create a GitHub Release
    required: false
    default: 'true'

  fail-on-multiple-labels:
    description: Fail if PR has more than one release label
    required: false
    default: 'true'

  dry-run:
    description: Run without writing any changes
    required: false
    default: 'false'

  target-branch:
    description: Branch to push release commit to
    required: false
    default: main

  commit-message-template:
    description: Commit message template — use {tag} as placeholder
    required: false
    default: 'chore(release): {tag}'

  sync-package-json:
    description: >
      When 'true', updates the version field in package.json to match the new semver.
      If package.json does not exist, a warning is logged and the step is skipped.
    required: false
    default: 'false'

  use-conventional-commits:
    description: >
      When 'true', scans PR commit messages for conventional commit prefixes
      (feat, fix, BREAKING CHANGE) to determine bump type when no release label
      is present. Requires pull-requests: read permission.
    required: false
    default: 'false'

  slack-webhook-url:
    description: >
      Slack Incoming Webhook URL. Accepts a comma-separated list to notify
      multiple channels.
    required: false
    default: ''

  discord-webhook-url:
    description: >
      Discord webhook URL. Accepts a comma-separated list to notify multiple
      channels.
    required: false
    default: ''

  notification-template:
    description: >
      Message template for notifications. Supports placeholders:
      {tag}, {bump}, {prTitle}, {prNumber}.
    required: false
    default: '🚀 Released {tag}: {prTitle} (#{prNumber})'

  use-release-pr:
    description: >
      When 'true', commits release files to a release/{tag} branch and opens a
      PR instead of pushing directly to the target branch. Requires
      pull-requests: write permission. Useful when branch protection blocks
      direct pushes.
    required: false
    default: 'false'

  tag-on-release-pr:
    description: >
      When 'true' (default) and use-release-pr is enabled, creates the git tag
      and GitHub Release immediately on the release branch rather than waiting
      for the PR to merge.
    required: false
    default: 'true'

  release-pr-base:
    description: >
      Base branch for the release PR when use-release-pr is true. Defaults to
      target-branch when not set.
    required: false
    default: ''

  enforce-channel-order:
    description: >
      When 'true', throws if a pre-release bump moves to a lower-precedence
      channel (e.g. beta → alpha). Channel order: alpha < beta < rc < stable.
    required: false
    default: 'false'

  packages:
    description: >
      Comma-separated list of package paths for monorepo support
      (e.g. 'packages/api,packages/web'). Each package must contain
      its own VERSION.md. When set, all packages are bumped together
      in a single release commit.
    required: false
    default: ''

  use-pr-template-labels:
    description: >
      When 'true', scans the PR body for checked Markdown checkboxes matching
      configured label names to determine bump type. Precedence: PR label >
      PR body checkbox > conventional commits > default-bump.
    required: false
    default: 'false'

  generate-badge:
    description: >
      When 'true', writes a Shields.io-compatible badge JSON file to badge-file
      after each successful release.
    required: false
    default: 'false'

  badge-color:
    description: Color for the version badge (any valid Shields.io color string)
    required: false
    default: orange

  badge-file:
    description: Path where the badge JSON file is written
    required: false
    default: .badges/version.json

  update-readme:
    description: >
      When 'true', updates the section of readme-file between
      readme-start-marker and readme-end-marker with the latest version
      install snippet.
    required: false
    default: 'false'

  readme-file:
    description: Path to the README file to update
    required: false
    default: README.md

  readme-start-marker:
    description: Start marker for the README block to replace
    required: false
    default: '<!-- VERSIONBOT:START -->'

  readme-end-marker:
    description: End marker for the README block to replace
    required: false
    default: '<!-- VERSIONBOT:END -->'

outputs:
  version:
    description: New semantic version (e.g. 1.2.3)

  tag:
    description: Created git tag (e.g. v1.2.3)

  bump:
    description: Bump type applied — major, minor, patch, or none

  skipped:
    description: true if the release was skipped (release:none label)

  release-pr-url:
    description: URL of the release PR (only set when use-release-pr is true)

  release-url:
    description: URL of the GitHub Release page (only set when create-github-release is true)

runs:
  using: node20
  main: dist/index.js
