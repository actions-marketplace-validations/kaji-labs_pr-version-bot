# Uses conventional commit prefixes (feat, fix, BREAKING CHANGE) to determine
# bump type when no release label is present.
# Add release:none label to skip a release entirely.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: kaji-labs/pr-version-bot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-conventional-commits: 'true'
          default-bump: none
