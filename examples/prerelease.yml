# Publishes pre-release versions for alpha/beta/rc testing before stable.
# Apply release:alpha, release:beta, or release:rc to a PR to trigger.
# Apply release:patch, release:minor, or release:major to promote to stable.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: kaji-labs/pr-version-bot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
