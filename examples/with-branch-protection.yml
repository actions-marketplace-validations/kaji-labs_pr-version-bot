# Uses release PR mode for repos where branch protection blocks direct pushes.
# Requires pull-requests: write permission.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: kaji-labs/pr-version-bot@v0.8.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-release-pr: 'true'
