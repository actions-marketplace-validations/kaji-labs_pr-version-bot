# Uses a GitHub App token so the action can push directly to a branch-protected
# main branch without needing a separate release PR.
#
# Prerequisites:
#   1. Create a GitHub App with Contents: write permission
#   2. Add the app as a bypass actor on your branch protection ruleset
#      (Settings → Rules → Rulesets → Bypass list → Add bypass → App)
#   3. Store APP_ID and APP_PRIVATE_KEY as repository secrets
#
# See docs/github-app-setup.md for step-by-step instructions.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: kaji-labs/pr-version-bot@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
