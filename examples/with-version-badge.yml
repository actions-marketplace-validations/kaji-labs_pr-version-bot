# Publishes a release, generates a Shields.io badge JSON, and updates the
# README install snippet between VERSIONBOT markers on every merged PR.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: kaji-labs/pr-version-bot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-badge: 'true'
          badge-color: orange
          update-readme: 'true'
